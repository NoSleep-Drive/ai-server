name: Deploy FastAPI AI Server to KT CLOUD

on:
  push:
    branches:
      - main
      - kt-cloud-deploy

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: 도커 허브 로그인
      uses: docker/login-action@v2
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 도커 이미지 빌드 및 푸시
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-ai:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-ai:latest


    - name: KT Cloud 서버에서 pull & 컨테이너 재실행
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.KT_CLOUD_HOST }}
        username: ${{ secrets.KT_CLOUD_USER }}
        key: ${{ secrets.KT_CLOUD_DEPLOY_SSH_KEY }}
        script: |
          set -e
          docker pull ${{ secrets.DOCKER_USERNAME }}/fastapi-ai:latest
          docker stop fastapi-ai || true
          docker rm fastapi-ai || true
          docker run -d --name fastapi-ai \
            -p 8000:8000 \
            --restart=always \
            ${{ secrets.DOCKER_USERNAME }}/fastapi-ai:latest
